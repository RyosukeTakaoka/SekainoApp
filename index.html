<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f4a11c" />
<title>ポテカウ | ポテトを数えるだけのアプリ</title>
<meta name="description" content="カメラでポテトを撮るだけ。本数を判定して称号をもらえる、それだけのニッチなネタアプリ「ポテカウ」。" />

<meta property="og:title" content="ポテカウ - ポテトを数えるだけのアプリ" />
<meta property="og:description" content="カメラでポテトを撮るだけ。あなたのポテトは何本?称号を判定します。" />
<meta property="og:type" content="website" />

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍟</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app">

  <header class="app-header">
    <h1><span class="emoji">🍟</span>ポテカウ</h1>
    <p class="tagline">ポテトの本数を数える。<br class="sp-only">ただ、それだけのアプリです。</p>
  </header>

  <main>

    <!-- STEP 1: 撮影・選択画面 -->
    <section id="screen-capture" class="screen active">

      <div class="camera-box">
        <video id="video" playsinline autoplay muted></video>
        <canvas id="overlay"></canvas>
        <div id="camera-placeholder" class="camera-placeholder">
          <p>📷</p>
          <p>カメラを起動するか、<br>写真を選んでください</p>
        </div>
      </div>

      <div class="btn-row">
        <button id="btn-start-camera" class="btn btn-primary">カメラを起動する</button>
        <button id="btn-shutter" class="btn btn-shutter" hidden>📸 パシャッ</button>
      </div>

      <div class="or-divider"><span>または</span></div>

      <label class="btn btn-outline file-label">
        写真を選ぶ
        <input type="file" id="file-input" accept="image/*" capture="environment" hidden />
      </label>

      <p class="note">※ 撮った写真は端末の外に送信されません。ぜんぶブラウザの中で判定しています。</p>
    </section>

    <!-- STEP 2: 判定中 -->
    <section id="screen-loading" class="screen">
      <div class="loader"></div>
      <p id="loading-text" class="loading-text">ポテト検査官が本数を数えています…</p>
    </section>

    <!-- STEP 3: 結果画面 -->
    <section id="screen-result" class="screen">
      <canvas id="result-card" width="720" height="900"></canvas>

      <div class="result-actions">
        <button id="btn-share-x" class="btn btn-x">𝕏 で結果をポストする</button>
        <button id="btn-share-native" class="btn btn-outline" hidden>画像を共有する</button>
        <button id="btn-save" class="btn btn-outline">画像を保存する</button>
        <button id="btn-retry" class="btn btn-ghost">もう一度数える</button>
      </div>
      <p class="note small">📝 保存した画像をXアプリに添付して投稿すると、判定カードごとシェアできます。</p>
    </section>

  </main>

  <footer class="app-footer">
    <p>ポテカウの判定は極めて適当です。厳密な本数保証は一切ありません。<br>
    お腹が空いてきたら、それは仕様です。</p>
    <p class="hashtag">#ポテカウ</p>
  </footer>

</div>

<canvas id="work-canvas" hidden></canvas>

<script src="js/app.js"></script>
</body>
</html>
